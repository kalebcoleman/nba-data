name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # Development tools are not package dependencies, so they are not in renv.lock.
      - name: Install check tools
        run: Rscript -e 'renv::install(c("lintr", "devtools", "rcmdcheck"))'

      - name: Lint
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

      - name: R CMD check
        run: devtools::check(args = c("--no-manual", "--as-cran"), error_on = "warning")
        shell: Rscript {0}
